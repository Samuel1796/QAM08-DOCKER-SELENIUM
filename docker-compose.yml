services:
  # /**
  #  * @service tests
  #  * @purpose Build the Docker image and execute the full Selenium + Maven suite.
  #  * @logic Persists raw Allure result files and generated HTML report to named volumes.
  #  * @command docker compose up --build tests
  #  */
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selenium-docker-tests
    volumes:
      # @output Raw test artifacts and rendered report survive container exit.
      - allure-results:/app/target/allure-results
      - allure-report:/allure-report

  # /**
  #  * @service allure-serve
  #  * @purpose Serve static Allure HTML via nginx for local review.
  #  * @dependency Waits until tests service exits successfully.
  #  * @command docker compose up --build
  #  * @access http://localhost:4040
  #  */
  allure-serve:
    image: nginx:alpine
    container_name: selenium-allure-serve
    depends_on:
      tests:
        condition: service_completed_successfully
    ports:
      - "4040:80"
    volumes:
      # @mount Read-only report volume mounted as nginx web root.
      - allure-report:/usr/share/nginx/html:ro

volumes:
  # /**
  #  * @purpose Shared named volumes decouple reports from container lifecycle.
  #  */
  allure-results:
  allure-report:
