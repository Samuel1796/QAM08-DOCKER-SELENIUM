name: API Test Automation CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn clean compile

      - name: Run tests
        run: mvn test
        continue-on-error: true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 30

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30

  allure-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Load test report history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Copy history to allure-results
        run: |
          mkdir -p target/allure-results/history
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history/* target/allure-results/history/ 2>/dev/null || true
          fi

      - name: Verify Allure results
        run: |
          if [ ! -d "target/allure-results" ]; then
            echo "::error::target/allure-results not found."
            exit 1
          fi
          N_RESULT=$(find target/allure-results -maxdepth 1 -type f -name "*-result.json" 2>/dev/null | wc -l)
          N_CONTAINER=$(find target/allure-results -maxdepth 1 -type f -name "*-container.json" 2>/dev/null | wc -l)
          N=$((N_RESULT + N_CONTAINER))
          if [ "$N" -eq 0 ]; then
            echo "::error::No Allure result/container JSON in target/allure-results."
            ls -la target/allure-results
            exit 1
          fi
          echo "Allure results: $N file(s)."

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Prepare report for GitHub Pages
        run: |
          mkdir -p allure-report-final
          if [ -d "target/site/allure-maven-plugin" ]; then
            cp -r target/site/allure-maven-plugin/* allure-report-final/
            echo "Copied from target/site/allure-maven-plugin"
          elif [ -d "target/allure-report" ]; then
            cp -r target/allure-report/* allure-report-final/
            echo "Copied from target/allure-report"
          else
            echo "::error::No Allure report directory found."
            ls -la target/
            ls -la target/site/ || true
            exit 1
          fi

      - name: Publish Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report-final

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report-final/
          retention-days: 30

  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-test-automation .

      - name: Run tests in Docker
        run: docker run --rm -v $(pwd)/target:/app/target api-test-automation
        continue-on-error: true

      - name: Upload Docker Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: target/surefire-reports/
          retention-days: 30

  notify-slack:
    runs-on: ubuntu-latest
    needs: [test, allure-report]
    if: always()

    steps:
      - name: Build Slack payload (report only)
        run: |
          python3 - <<'PY'
          import json
          import os

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          owner, name = (repo.split("/", 1) + [""])[:2] if "/" in repo else ("", repo)
          branch = os.environ.get("GITHUB_REF_NAME", "")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL')}/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
          report_url = f"https://{owner}.github.io/{name}/" if owner and name else "GitHub Pages URL unavailable"

          test_result = os.environ.get("TEST_JOB_RESULT", "unknown")
          report_result = os.environ.get("REPORT_JOB_RESULT", "unknown")
          passed = test_result == "success" and report_result == "success"
          status_text = "PASSED" if passed else "ATTENTION"
          status_emoji = ":white_check_mark:" if passed else ":warning:"

          payload = {
              "text": f"Allure Report Notification - {status_text}. Report: {report_url}",
              "blocks": [
                  {
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": "API Test Report",
                          "emoji": True,
                      },
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"{status_emoji} *Allure Report Status:* *{status_text}*",
                      },
                  },
                  {
                      "type": "section",
                      "fields": [
                          {"type": "mrkdwn", "text": f"*Repository*\n`{repo}`"},
                          {"type": "mrkdwn", "text": f"*Branch*\n`{branch}`"},
                          {"type": "mrkdwn", "text": f"*Test Job*\n`{test_result}`"},
                          {"type": "mrkdwn", "text": f"*Report Job*\n`{report_result}`"},
                      ],
                  },
                  {
                      "type": "actions",
                      "elements": [
                          {
                              "type": "button",
                              "text": {"type": "plain_text", "text": "View Allure Report", "emoji": True},
                              "url": report_url,
                              "style": "primary",
                          },
                          {
                              "type": "button",
                              "text": {"type": "plain_text", "text": "View Workflow Run", "emoji": True},
                              "url": run_url,
                          },
                      ],
                  },
                  {
                      "type": "context",
                      "elements": [
                          {"type": "mrkdwn", "text": "Generated by GitHub Actions"}
                      ],
                  },
              ],
          }

          with open("slack_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY
        env:
          TEST_JOB_RESULT: ${{ needs.test.result }}
          REPORT_JOB_RESULT: ${{ needs.allure-report.result }}

      - name: Notify Slack
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload-file-path: slack_payload.json
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


